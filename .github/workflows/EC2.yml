name: Entrega Continua

on:
  workflow_call:

jobs:
  EC2:
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: programa

      - name: Deploy and run application on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ec2-user

            # Variáveis de ambiente do banco
            export DBHOST=${{ secrets.DBHOST }}
            export DBUSER=${{ secrets.DBUSER }}
            export DBPASSWORD=${{ secrets.DBPASSWORD }}
            export DBNAME=${{ secrets.DBNAME }}
            export DBPORT=${{ secrets.PORT }}

            # Porta da aplicação
            export PORT=8000

            chmod +x main

            # Mata processo antigo se existir
            pkill -f "./main" || true

            # Sobe a aplicação
            nohup ./main > app.log 2>&1 &
